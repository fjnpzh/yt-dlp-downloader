<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>yt-dlp 下载器</title>
    <link rel="stylesheet" href="/main.css"/>
</head>
<body>
<div class="shell">
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 20h16"/>
                </svg>
            </div>
            <div class="brand-text">
                <h1>yt-dlp 下载器</h1>
                <p>批量解析 · 智能合并 · 全程本地</p>
            </div>
        </div>
        <div class="topbar-actions">
            <button class="icon-btn" id="btnHelp" title="使用说明">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.4 2.3c-.6.3-.9.8-.9 1.4v.3"/><circle cx="12" cy="17" r=".8" fill="currentColor" stroke="none"/></svg>
            </button>
            <button class="icon-btn" id="btnReset" title="恢复默认设置">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
            </button>
        </div>
    </header>

    <main class="workspace">
        <section class="col col-left">
            <div class="card card-url">
                <div class="card-head">
                    <div class="card-title"><span class="dot"></span>视频链接</div>
                    <div class="head-actions">
                        <span class="counter" id="urlCount">0 个链接</span>
                        <button class="mini" id="btnPaste">粘贴</button>
                        <button class="mini" id="btnClearUrls">清空</button>
                    </div>
                </div>
                <textarea id="urls" spellcheck="false" autocomplete="off"
                          placeholder="每行一个链接，支持批量&#10;https://www.youtube.com/watch?v=xxxxxxxxxxx&#10;https://www.bilibili.com/video/BVxxxxxxxx"></textarea>
            </div>

            <div class="card">
                <div class="card-head">
                    <div class="card-title"><span class="dot"></span>下载选项</div>
                </div>

                <div class="field">
                    <label for="outDir">输出目录</label>
                    <div class="row">
                        <input id="outDir" class="input mono" type="text" spellcheck="false"/>
                        <button class="btn ghost" id="btnBrowseDir">浏览</button>
                        <button class="btn ghost" id="btnOpenDir">打开</button>
                    </div>
                </div>

                <div class="field">
                    <label>输出格式</label>
                    <div class="segmented" id="fmtGroup">
                        <button type="button" class="seg" data-value="mp4"><b>视频 + 音频</b><em>MP4</em></button>
                        <button type="button" class="seg" data-value="video"><b>仅视频</b><em>无音轨</em></button>
                        <button type="button" class="seg" data-value="mp3"><b>仅音频</b><em>MP3</em></button>
                    </div>
                </div>

                <div class="field">
                    <label>分辨率上限</label>
                    <div class="chips" id="resGroup">
                        <button type="button" class="chip" data-value="best">最佳</button>
                        <button type="button" class="chip" data-value="2160">4K</button>
                        <button type="button" class="chip" data-value="1440">2K</button>
                        <button type="button" class="chip" data-value="1080">1080p</button>
                        <button type="button" class="chip" data-value="720">720p</button>
                        <button type="button" class="chip" data-value="480">480p</button>
                        <button type="button" class="chip" data-value="360">360p</button>
                    </div>
                </div>

                <details class="advanced" id="advanced">
                    <summary>
                        <span>高级选项</span>
                        <span class="adv-badge" id="advBadge">Cookies / 代理 / 模板</span>
                        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
                    </summary>
                    <div class="adv-body">
                        <div class="field">
                            <label for="tmpl">文件名模板</label>
                            <input id="tmpl" class="input mono" type="text" spellcheck="false" placeholder="%(title)s.%(ext)s（留空使用默认）"/>
                        </div>
                        <div class="field">
                            <label for="proxy">代理服务器</label>
                            <input id="proxy" class="input mono" type="text" spellcheck="false" placeholder="http://127.0.0.1:7890 或 socks5://127.0.0.1:1080"/>
                        </div>
                        <div class="field">
                            <label for="cookies">浏览器 Cookies</label>
                            <div class="row">
                                <select id="cookies" class="input">
                                    <option value="none">不使用 Cookies</option>
                                    <option value="chrome">读取 Chrome 登录态</option>
                                    <option value="edge">读取 Edge 登录态</option>
                                    <option value="firefox">读取 Firefox 登录态</option>
                                    <option value="file">使用 Cookies 文件…</option>
                                </select>
                                <button class="btn ghost" id="btnCookiesFile" hidden>选择文件</button>
                            </div>
                            <p class="hint" id="cookiesHint">Chrome / Edge 需先完全退出浏览器，Firefox 通常无需退出。</p>
                        </div>
                        <div class="toggles">
                            <label class="switch"><input type="checkbox" id="noPlaylist" checked/><i></i><span>仅下载当前视频</span></label>
                            <label class="switch"><input type="checkbox" id="thumb"/><i></i><span>同时保存封面</span></label>
                        </div>
                    </div>
                </details>
            </div>

            <div class="card card-action">
                <div class="progress-head">
                    <div class="pct"><span id="pct">0</span><small>%</small></div>
                    <div class="stats">
                        <div><span class="k">速度</span><span class="v" id="speed">—</span></div>
                        <div><span class="k">剩余</span><span class="v" id="eta">—</span></div>
                        <div><span class="k">大小</span><span class="v" id="size">—</span></div>
                        <div><span class="k">任务</span><span class="v" id="item">—</span></div>
                    </div>
                </div>
                <div class="bar"><div class="bar-fill" id="barFill"></div></div>
                <div class="file-line" id="fileLine">—</div>
                <div class="actions">
                    <button class="btn primary" id="btnStart">开始下载</button>
                    <button class="btn ghost danger-text" id="btnCancel" disabled>取消</button>
                </div>
            </div>
        </section>

        <section class="col col-right">
            <div class="card">
                <div class="card-head">
                    <div class="card-title"><span class="dot"></span>运行环境</div>
                    <div class="head-actions">
                        <button class="mini" id="btnRefreshDeps">重新检测</button>
                    </div>
                </div>
                <ul class="deps" id="deps"></ul>
            </div>

            <div class="card card-log">
                <div class="card-head">
                    <div class="card-title"><span class="dot"></span>运行日志</div>
                    <div class="head-actions">
                        <label class="mini-check"><input type="checkbox" id="autoScroll" checked/><span>自动滚动</span></label>
                        <button class="mini" id="btnClearLog">清空</button>
                    </div>
                </div>
                <div class="log" id="log"></div>
            </div>
        </section>
    </main>

    <footer class="statusbar">
        <div class="status"><span class="status-dot" id="statusDot"></span><span id="statusText">就绪</span></div>
        <div class="hints"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> 开始 · <kbd>Esc</kbd> 取消 · 设置自动保存</div>
    </footer>
</div>

<div class="modal" id="helpModal" hidden>
    <div class="modal-card">
        <div class="modal-head">
            <h2>使用说明</h2>
            <button class="icon-btn" id="btnCloseHelp">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
            </button>
        </div>
        <pre class="modal-body" id="helpBody"></pre>
    </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/main.js"></script>
</body>
</html>
